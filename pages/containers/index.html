<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Containers</title>
    <link rel="stylesheet" href="../../css/base.css" />
    <link rel="stylesheet" href="containers.css" />
    <link rel="stylesheet" href="../../ext/icons/iconfont.css" />
  </head>
  <body>
    <div class="containers-hero">
      <h1 data-string="containersPageTitle"></h1>
      <p data-string="containersPageDescription"></p>
    </div>

    <div class="containers-main">
      <div class="containers-toolbar">
        <button id="new-container-button"></button>
      </div>

      <div id="container-list"></div>

      <div id="container-editor" hidden>
        <h2 id="editor-heading"></h2>
        <div class="editor-row">
          <label for="container-name-input" data-string="containersNameLabel"></label>
          <input id="container-name-input" type="text" maxlength="64" autocomplete="off" />
        </div>
        <div class="editor-row">
          <label data-string="containersColorLabel"></label>
          <div id="color-picker" class="picker"></div>
        </div>
        <div class="editor-row">
          <label data-string="containersIconLabel"></label>
          <div id="icon-picker" class="picker"></div>
        </div>
        <div class="editor-actions">
          <button id="editor-save"></button>
          <button id="editor-cancel"></button>
        </div>
      </div>
    </div>

    <script src="../../dist/localization.build.js"></script>
    <script src="containersPage.js"></script>
  </body>
</html>
