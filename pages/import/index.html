<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Import from Another Browser</title>
    <link rel="stylesheet" href="../../css/tokens.css" />
    <link rel="stylesheet" href="../../css/base.css" />
    <link rel="stylesheet" href="../shared/seaglass.css" />
    <link rel="stylesheet" href="import.css" />
    <link rel="stylesheet" href="../../ext/icons/iconfont.css" />
  </head>
  <body>
    <main class="imp">
      <header class="imp-head">
        <h1 data-string="importPageTitle"></h1>
        <p data-string="importPageDescription"></p>
      </header>

      <section class="imp-sources" id="source-list"></section>

      <section class="imp-panel" id="tab-panel" hidden>
        <div class="imp-toolbar">
          <label class="imp-search">
            <i class="i carbon:search"></i>
            <input id="tab-search" spellcheck="false" />
          </label>
          <span id="selection-count" class="imp-count"></span>
          <button id="select-all" class="imp-link" data-string="importSelectAll"></button>
          <button id="select-none" class="imp-link" data-string="importSelectNone"></button>
        </div>
        <div id="site-list" class="imp-sites"></div>
      </section>

      <div id="imp-empty" class="imp-empty" hidden></div>
    </main>

    <footer class="imp-bar" id="action-bar" hidden>
      <div class="imp-bar-inner">
        <div class="imp-bar-field">
          <span data-string="importIntoLabel"></span>
          <select id="target-select"></select>
        </div>
        <div class="imp-bar-field">
          <span data-string="importContainerLabel"></span>
          <select id="container-select"></select>
        </div>
        <label class="imp-bar-field imp-bookmarks" id="bookmarks-row" hidden>
          <input type="checkbox" id="import-bookmarks" />
          <span data-string="importIncludeBookmarks"></span>
        </label>
        <span id="import-status" class="imp-status"></span>
        <button id="import-button" class="imp-go">
          <span id="import-button-label"></span>
          <i class="i carbon:arrow-right"></i>
        </button>
      </div>
    </footer>

    <script src="../../dist/localization.build.js"></script>
    <script src="../../js/util/settings/settingsContent.js"></script>
    <script src="../../js/util/theme.js"></script>
    <script src="importPage.js"></script>
  </body>
</html>
